spring.application.name=journeygram

# ── Database ──────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:journeygram}
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD:${DB_PASSWORD:}}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ── JWT ───────────────────────────────────────────────────
jwt.secret=${JWT_SECRET}
jwt.expiration=3600000

# ── API Keys ──────────────────────────────────────────────
gemini.api.key=${GEMINI_API_KEY:}
groq.api.key=${GROQ_API_KEY:}

# ── CORS ──────────────────────────────────────────────────
cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:8081,http://localhost:19006}

# ── Request Size Limits ───────────────────────────────────
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# ── Logging ───────────────────────────────────────────────
logging.level.com.srtk.journeygram=INFO
logging.level.org.springframework.security=WARN